<div class="auth-wrapper">
  <div class="auth-content">
    <div class="auth-bg">
      <span class="r"></span>
      <span class="r s"></span>
      <span class="r s"></span>
      <span class="r"></span>
    </div>
    <div class="card">
      <div class="card-body text-center">
        <div class="mb-4">
          <i class="feather icon-check-circle auth-icon text-success"></i>
        </div>
        <h3 class="mb-4" jhiTranslate="activate.title">Activation</h3>

        <!-- Success Alert -->
        @if (success()) {
          <div class="alert alert-success">
            <span jhiTranslate="activate.messages.success"><strong>Your user account has been activated.</strong> Please</span>
            <a class="alert-link" routerLink="/login" jhiTranslate="global.messages.info.authenticated.link">sign in</a>.
          </div>
        }

        <!-- Error Alert -->
        @if (error()) {
          <div class="alert alert-danger">
            <i class="feather icon-alert-triangle"></i>
            <span jhiTranslate="activate.messages.error"
              ><strong>Your user could not be activated.</strong> Please use the registration form to sign up.</span
            >
          </div>
        }

        <!-- Back to login link -->
        <p class="mt-4 mb-0 text-muted">
          <a routerLink="/login" jhiTranslate="global.messages.info.returnlink">Back to Login</a>
        </p>
      </div>
    </div>
  </div>
</div>
